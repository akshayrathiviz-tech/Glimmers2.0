<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241640">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Glimmer – a firefly dodge game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --dusk: #241640;
    --marsh: #1F5C63;
    --glow: #D9F26B;
    --ember: #FF7A6B;
    --mist: #EDE6FF;
    --font: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0;
    background: var(--dusk);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { height: 100%; position: relative; font-family: var(--font); color: var(--mist); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none;
  }
  .score { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .combo {
    display: inline-block; margin-left: 8px; font-size: 20px; font-weight: 700;
    color: var(--glow); opacity: 0; transition: opacity .2s;
  }
  .combo.on { opacity: 1; }
  .best { font-size: 14px; opacity: .65; margin-top: 4px; }
  .lives { display: flex; gap: 8px; padding-top: 6px; }
  .life {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 12px 2px rgba(217,242,107,.7);
    transition: transform .25s, opacity .25s, background .25s, box-shadow .25s;
  }
  .life.lost { background: transparent; box-shadow: none; opacity: .35; border: 2px solid var(--mist); transform: scale(.8); }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(36,22,64,.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .panel { max-width: 340px; text-align: center; }
  h1 { margin: 0 0 10px; font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: .95; color: var(--glow); text-shadow: 0 0 28px rgba(217,242,107,.45); }
  p { margin: 0 0 22px; font-size: 18px; line-height: 1.4; opacity: .9; }
  .big { font-size: 56px; font-weight: 800; line-height: 1; margin: 0 0 4px; font-variant-numeric: tabular-nums; }
  .note { font-size: 16px; margin-bottom: 22px; opacity: .8; }
  button {
    font: 700 20px var(--font); color: var(--dusk); background: var(--glow);
    border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer;
    box-shadow: 0 0 24px rgba(217,242,107,.45);
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--mist); outline-offset: 3px; }
  .legend { display: flex; justify-content: center; gap: 22px; margin: 0 0 24px; font-size: 15px; opacity: .85; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
  .thorn { width: 14px; height: 14px; background: var(--ember); clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); }

  .mute {
    position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 46px; height: 46px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(237,230,255,.16); color: var(--mist); box-shadow: none; z-index: 5;
  }
  .mute svg { width: 24px; height: 24px; }

  .stack { display: flex; flex-direction: column; align-items: center; }
  button.ghost { background: rgba(237,230,255,.14); color: var(--mist); box-shadow: none; margin-top: 12px; font-size: 18px; padding: 13px 30px; }
  .coins { display: inline-flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 17px; font-weight: 700; }
  .stack .coins { margin-top: 18px; }
  .coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #FFD166; box-shadow: 0 0 8px rgba(255,209,102,.6), inset 0 0 0 3px #E8A93B; }
  .overlay.shop { align-items: flex-start; overflow-y: auto; }
  .shop .panel { max-width: 420px; width: 100%; margin: auto; padding-bottom: 90px; }
  .shop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .shop h2 { margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.03em; color: var(--glow); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
  button.card {
    font: 400 16px var(--font); color: var(--mist); background: rgba(237,230,255,.1); box-shadow: none;
    border: 2px solid transparent; border-radius: 18px; padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  button.card.sel { border-color: var(--glow); background: rgba(217,242,107,.1); }
  .card canvas { position: static; inset: auto; width: 84px; height: 84px; touch-action: auto; }
  .card .nm { font-weight: 700; font-size: 17px; }
  .card .st { font-size: 14px; opacity: .9; display: flex; align-items: center; gap: 6px; min-height: 18px; }

  .menu-best { font-size: 14px; opacity: .65; margin-top: 8px; }
  button.pausebtn { position: absolute; right: 14px; top: 52px; width: 42px; height: 42px; padding: 0; display: flex; align-items: center; justify-content: center; background: rgba(237,230,255,.16); color: var(--mist); box-shadow: none; }
  button.pausebtn[hidden] { display: none; }
  button.pausebtn svg { width: 20px; height: 20px; }
  .row { text-align: left; margin-bottom: 24px; }
  .lbl { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 17px; margin-bottom: 10px; }
  .lbl span { color: var(--glow); font-variant-numeric: tabular-nums; }
  .seg { display: flex; background: rgba(237,230,255,.12); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; font: 700 16px var(--font); color: var(--mist); background: transparent; box-shadow: none; padding: 11px 14px; border-radius: 999px; }
  .seg button.on { background: var(--glow); color: var(--dusk); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px; background: rgba(237,230,255,.22); outline: none; margin: 14px 0 8px; touch-action: pan-y; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 32px; border-radius: 50%; background: var(--glow); border: 0; box-shadow: 0 0 14px rgba(217,242,107,.7); }
  input[type=range]::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%; background: var(--glow); border: 0; }
  input[type=range]:focus-visible { outline: 3px solid var(--mist); outline-offset: 8px; }
  input[type=range]:disabled { opacity: .35; }
  .range-ends { display: flex; justify-content: space-between; font-size: 13px; opacity: .65; }
  .row.off { opacity: .45; }

  .hud[hidden] { display: none; }
  .prog { position: absolute; left: 18px; right: 18px; top: 6px; height: 6px; border-radius: 99px; background: rgba(237,230,255,.16); overflow: hidden; pointer-events: none; }
  .prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--glow); box-shadow: 0 0 10px rgba(217,242,107,.7); transition: width .2s linear; }
  .banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; padding: 0 24px; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
  .banner.on { opacity: 1; transform: none; }
  .banner b { display: block; font-size: 38px; font-weight: 800; letter-spacing: -0.02em; color: var(--glow); text-shadow: 0 0 24px rgba(217,242,107,.5); }
  .banner span { font-size: 18px; opacity: .92; }
  .lvlsel { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .lvlname { min-width: 160px; display: flex; flex-direction: column; }
  .lvlname b { font-size: 24px; font-weight: 800; }
  .lvlname span { font-size: 15px; opacity: .8; }
  button.step { width: 44px; height: 44px; padding: 0; font-size: 26px; line-height: 1; background: rgba(237,230,255,.16); color: var(--mist); box-shadow: none; }
  button.step:disabled { opacity: .25; cursor: default; }
</style>
</head>
<body>
<canvas id="c" aria-label="Glimmer game"></canvas>

<div class="hud" id="hud" hidden>
  <div class="prog"><i id="progFill"></i></div>
  <div>
    <div><span class="score" id="score">0</span><span class="combo" id="combo">x2</span></div>
    <div class="best" id="best"></div>
    <div class="coins"><i class="coin"></i><span id="runCoins">0</span></div>
  </div>
  <div class="lives" id="lives" aria-label="Lives"></div>
</div>

<div class="banner" id="banner"></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Glimmer</h1>
    <p>Fly through the marsh and reach the glow at the end of each level.</p>
    <div class="legend"><span><i class="dot"></i>Catch</span><span><i class="thorn"></i>Dodge</span></div>
    <div class="stack">
      <div class="lvlsel"><button class="step" id="lvlPrev" aria-label="Previous level">&#8249;</button><div class="lvlname"><b id="lvlNum">Level 1</b><span id="lvlDest"></span></div><button class="step" id="lvlNext" aria-label="Next level">&#8250;</button></div>
      <button id="start">Play</button>
      <button class="ghost" id="openShop">Avatars</button>
      <button class="ghost" id="openSettings">Settings</button>
      <div class="coins"><i class="coin"></i><span class="coinTotal">0</span></div>
      <div class="menu-best" id="menuBest"></div>
    </div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <h1 style="font-size:44px">Lights out</h1>
    <div class="note" id="overLevel" style="margin-bottom:6px"></div>
    <div class="big" id="final">0</div>
    <div class="note" id="finalNote"></div>
    <div class="note" id="earned" style="margin-top:-12px"></div>
    <div class="stack"><button id="again">Fly again</button><button class="ghost" id="openShop2">Avatars</button><button class="ghost" id="toMenu">Menu</button></div>
  </div>
</div>

<div class="overlay" id="complete" hidden>
  <div class="panel">
    <h1 style="font-size:44px" id="cTitle">Level clear!</h1>
    <div class="note" id="cDest"></div>
    <div class="big" id="cScore">0</div>
    <div class="note" id="cCoins"></div>
    <div class="stack"><button id="nextLevel">Next level</button><button class="ghost" id="cMenu">Menu</button></div>
  </div>
</div>

<button class="pausebtn" id="pauseBtn" aria-label="Pause" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>

<div class="overlay" id="pause" hidden>
  <div class="panel">
    <h1 style="font-size:44px">Paused</h1>
    <p>Your run is on hold.</p>
    <div class="stack">
      <button id="resume">Resume</button>
      <button class="ghost" id="pauseSettings">Settings</button>
      <button class="ghost" id="quit">Quit to menu</button>
    </div>
  </div>
</div>

<div class="overlay shop" id="settings" hidden>
  <div class="panel">
    <div class="shop-head"><h2>Settings</h2></div>
    <div class="row">
      <div class="lbl">Controls</div>
      <div class="seg" id="ctlSeg"><button type="button" data-mode="joystick">Joystick</button><button type="button" data-mode="drag">Drag</button></div>
    </div>
    <div class="row" id="sensRow">
      <div class="lbl"><label for="sens">Joystick sensitivity</label><span id="sensVal">1.0x</span></div>
      <input type="range" id="sens" min="0.5" max="2" step="0.1" value="1">
      <div class="range-ends"><span>Slow</span><span>Fast</span></div>
    </div>
    <div class="row">
      <div class="lbl">Sound</div>
      <div class="seg" id="sndSeg"><button type="button" data-snd="on">On</button><button type="button" data-snd="off">Off</button></div>
    </div>
    <button id="settingsBack">Back</button>
  </div>
</div>

<div class="overlay shop" id="shop" hidden>
  <div class="panel">
    <div class="shop-head"><h2>Avatars</h2><div class="coins"><i class="coin"></i><span class="coinTotal">0</span></div></div>
    <div class="grid" id="grid"></div>
    <p class="note" id="shopMsg" style="margin-top:14px"></p>
    <button id="shopBack">Back</button>
  </div>
</div>

<button class="mute" id="mute" aria-label="Sound on"></button>

<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var bestEl = document.getElementById('best');
  var livesEl = document.getElementById('lives');
  var menu = document.getElementById('menu');
  var over = document.getElementById('over');
  var finalEl = document.getElementById('final');
  var finalNote = document.getElementById('finalNote');
  var earnedEl = document.getElementById('earned');
  var runCoinsEl = document.getElementById('runCoins');
  var coinTotals = document.querySelectorAll('.coinTotal');
  var pauseEl = document.getElementById('pause');
  var pauseBtn = document.getElementById('pauseBtn');
  var settingsEl = document.getElementById('settings');
  var menuBestEl = document.getElementById('menuBest');
  var completeEl = document.getElementById('complete');
  var progressEl = document.getElementById('progFill');
  var bannerEl = document.getElementById('banner');

  var COLORS = { dusk: '#241640', marsh: '#1F5C63', glow: '#D9F26B', ember: '#FF7A6B', mist: '#EDE6FF' };

  var W = 0, H = 0, S = 1, dpr = 1;
  var state = 'menu';
  var best = 0;
  try { best = parseInt(localStorage.getItem('glimmer-best') || '0', 10) || 0; } catch (e) {}

  var player, hazards, orbs, particles, trail, stars;
  var runCoins = 0;
  var level = 1, maxLevel = 1, P = null, goal = null, wind = { t: 0, next: 6, dir: 1 };
  try { maxLevel = Math.max(1, parseInt(localStorage.getItem('glimmer-maxlevel') || '1', 10) || 1); level = maxLevel; } catch (e) {}
  var score, lives, t, streak, spawnT, inv, shake, lastShownScore, last;
  var keys = {};
  var JOY_R = 52;
  var ctl = { mode: 'joystick', active: false, id: null, bx: 0, by: 0, sx: 0, sy: 0 };
  try { var cm = localStorage.getItem('glimmer-controls'); if (cm === 'drag' || cm === 'joystick') ctl.mode = cm; } catch (e) {}

  // ---- Avatars and coins ----
  var AVATARS = [
    { id: 'firefly', name: 'Firefly', cost: 0, glow: '#D9F26B' },
    { id: 'moth', name: 'Moonmoth', cost: 30, glow: '#C9B8FF' },
    { id: 'ember', name: 'Ember', cost: 60, glow: '#FFB86B' },
    { id: 'jelly', name: 'Moonjelly', cost: 100, glow: '#6BE3FF' },
    { id: 'star', name: 'Starling', cost: 150, glow: '#FFE27A' }
  ];
  var wallet = { coins: 0, owned: ['firefly'], sel: 'firefly' };
  try {
    var rawW = JSON.parse(localStorage.getItem('glimmer-wallet') || 'null');
    if (rawW && typeof rawW.coins === 'number') {
      wallet.coins = rawW.coins;
      if (Array.isArray(rawW.owned) && rawW.owned.length) wallet.owned = rawW.owned;
      if (rawW.sel && wallet.owned.indexOf(rawW.sel) >= 0) wallet.sel = rawW.sel;
    }
  } catch (e) {}
  function saveWallet() { try { localStorage.setItem('glimmer-wallet', JSON.stringify(wallet)); } catch (e) {} }
  function avatarById(id) { for (var i = 0; i < AVATARS.length; i++) if (AVATARS[i].id === id) return AVATARS[i]; return AVATARS[0]; }
  function refreshCoinTotals() { for (var i = 0; i < coinTotals.length; i++) coinTotals[i].textContent = wallet.coins; }

  function drawAvatar(g, id, x, y, r, now, gs) {
    var col = avatarById(id).glow;
    g.save();
    g.globalCompositeOperation = 'lighter';
    var gr = g.createRadialGradient(x, y, 0, x, y, r * gs);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 0.5; g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r * gs, 0, Math.PI * 2); g.fill();
    g.restore();
    g.globalAlpha = 1;
    var eye = function (ex, ey, er) { g.fillStyle = '#241640'; g.beginPath(); g.arc(ex, ey, er, 0, Math.PI * 2); g.fill(); };
    var flap = Math.sin(now * 36) * 0.5;
    var i;
    if (id === 'moth') {
      g.fillStyle = 'rgba(237,230,255,.85)';
      [-1, 1].forEach(function (s) {
        g.save(); g.translate(x, y - r * 0.1); g.rotate(s * (-0.9 + flap * 0.4));
        g.beginPath(); g.ellipse(s * r * 1.1, 0, r * 1.2, r * 0.65, 0, 0, Math.PI * 2); g.fill(); g.restore();
        g.save(); g.translate(x, y + r * 0.3); g.rotate(s * (0.7 - flap * 0.3));
        g.beginPath(); g.ellipse(s * r * 0.8, 0, r * 0.8, r * 0.45, 0, 0, Math.PI * 2); g.fill(); g.restore();
      });
      g.fillStyle = '#FFFFFF';
      g.beginPath(); g.ellipse(x, y, r * 0.32, r * 0.8, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#EDE6FF'; g.lineWidth = Math.max(1, r * 0.08); g.lineCap = 'round';
      g.beginPath(); g.moveTo(x - r * 0.1, y - r * 0.7); g.lineTo(x - r * 0.45, y - r * 1.15);
      g.moveTo(x + r * 0.1, y - r * 0.7); g.lineTo(x + r * 0.45, y - r * 1.15); g.stroke();
      eye(x - r * 0.13, y - r * 0.35, r * 0.09); eye(x + r * 0.13, y - r * 0.35, r * 0.09);
    } else if (id === 'ember') {
      var fl = Math.sin(now * 18) * r * 0.12;
      g.fillStyle = col;
      g.beginPath(); g.moveTo(x + fl, y - r * 1.6);
      g.quadraticCurveTo(x + r * 1.1, y - r * 0.1, x, y + r * 0.95);
      g.quadraticCurveTo(x - r * 1.1, y - r * 0.1, x + fl, y - r * 1.6); g.fill();
      g.fillStyle = '#FFE3B0';
      g.beginPath(); g.moveTo(x, y - r * 0.5);
      g.quadraticCurveTo(x + r * 0.55, y + r * 0.2, x, y + r * 0.75);
      g.quadraticCurveTo(x - r * 0.55, y + r * 0.2, x, y - r * 0.5); g.fill();
      eye(x - r * 0.2, y + r * 0.2, r * 0.1); eye(x + r * 0.2, y + r * 0.2, r * 0.1);
    } else if (id === 'jelly') {
      g.strokeStyle = col; g.lineWidth = Math.max(1.5, r * 0.14); g.lineCap = 'round'; g.globalAlpha = 0.85;
      for (i = 0; i < 4; i++) {
        var tx = x - r * 0.6 + i * r * 0.4;
        g.beginPath(); g.moveTo(tx, y + r * 0.35);
        g.quadraticCurveTo(tx + Math.sin(now * 5 + i) * r * 0.35, y + r * 1.0, tx + Math.sin(now * 5 + i + 1) * r * 0.2, y + r * 1.7);
        g.stroke();
      }
      g.globalAlpha = 1;
      g.fillStyle = 'rgba(184,241,255,.95)';
      g.beginPath(); g.arc(x, y - r * 0.1, r * 0.95, Math.PI, 0);
      g.quadraticCurveTo(x, y + r * 0.6, x - r * 0.95, y - r * 0.1); g.fill();
      eye(x - r * 0.3, y - r * 0.1, r * 0.12); eye(x + r * 0.3, y - r * 0.1, r * 0.12);
    } else if (id === 'star') {
      g.fillStyle = col;
      g.beginPath();
      for (i = 0; i < 10; i++) {
        var rad = i % 2 === 0 ? r * 1.3 : r * 0.58, a = -Math.PI / 2 + i * Math.PI / 5 + Math.sin(now * 3) * 0.15;
        var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath(); g.fill();
      eye(x - r * 0.26, y + r * 0.05, r * 0.1); eye(x + r * 0.26, y + r * 0.05, r * 0.1);
    } else {
      g.fillStyle = 'rgba(237,230,255,.75)';
      g.save(); g.translate(x, y - r * 0.3); g.rotate(-0.6 + flap * 0.5);
      g.beginPath(); g.ellipse(-r * 0.9, 0, r * 0.9, r * 0.38, 0, 0, Math.PI * 2); g.fill(); g.restore();
      g.save(); g.translate(x, y - r * 0.3); g.rotate(0.6 - flap * 0.5);
      g.beginPath(); g.ellipse(r * 0.9, 0, r * 0.9, r * 0.38, 0, 0, Math.PI * 2); g.fill(); g.restore();
      g.fillStyle = col;
      g.beginPath(); g.arc(x, y, r * 0.7, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#241640';
      g.beginPath(); g.arc(x, y - r * 0.55, r * 0.32, 0, Math.PI * 2); g.fill();
    }
  }

  // ---- Shop ----
  var shopEl = document.getElementById('shop');
  var gridEl = document.getElementById('grid');
  var shopMsg = document.getElementById('shopMsg');
  var shopFrom = 'menu';
  var previews = [];
  function openShop(from) {

  // ---- Sound (synthesized with Web Audio, no files needed) ----
  var audio = { ctx: null, master: null, muted: false, chirpT: 2 };

  var muteBtn = document.getElementById('mute');
  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function drawMute() {

  function initAudio() {
    if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }

    try {
      audio.ctx = new AC();
      audio.master = audio.ctx.createGain();

  }

  function setMuted(m) {
    audio.muted = m;
    try { localStorage.setItem('glimmer-muted', m ? '1' : '0'); } catch (e) {}
    if (audio.ctx) audio.master.gain.setTargetAtTime(m ? 0 : 0.8, audio.ctx.currentTime, 0.05);
    drawMute();

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!audio.ctx || audio.muted) return;
    var c = audio.ctx, t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function noiseBurst(dur, vol, cutoff) {
    if (!audio.ctx || audio.muted) return;
    var c = audio.ctx, len = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff || 800;
    var g = c.createGain(); g.gain.value = vol || 0.3;

  var NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
  function sfxCollect(streak) {
    var f = NOTES[(Math.max(1, streak) - 1) % NOTES.length];

    tone(f * 2, 0.14, 'triangle', 0.07, 0, 0.03);
  }
  function sfxHit() {

    tone(190, 0.32, 'sawtooth', 0.2, 55);
  }
  function sfxOver() {
    var seq = [392, 329.63, 261.63, 196];
    for (var i = 0; i < seq.length; i++) tone(seq[i], 0.32, 'triangle', 0.2, 0, 0.15 + i * 0.2);
  }
  function sfxStart() {
    tone(392, 0.15, 'sine', 0.18);
    tone(523.25, 0.15, 'sine', 0.18, 0, 0.1);
    tone(659.25, 0.28, 'sine', 0.2, 0, 0.2);
  }
  function sfxWin() {
    var seq = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    for (var i = 0; i < seq.length; i++) tone(seq[i], 0.45, 'triangle', 0.2, 0, i * 0.12);

  function chirp() {

  }
  var music = { gain: null, step: 0, next: 0, timer: null };
  var CHORDS = [[220, 261.63, 329.63, 440], [174.61, 220, 261.63, 349.23], [261.63, 329.63, 392, 523.25], [196, 246.94, 293.66, 392]];
  var ARP = [0, 1, 2, 3, 2, 1, 2, 3];
  function musicNote(freq, t0, dur, type, vol) {
    var c = audio.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  }
  function scheduleMusic() {
    var c = audio.ctx;
    if (!c || c.state !== 'running') return;
    var stepDur = 0.43;
    if (music.next < c.currentTime) music.next = c.currentTime + 0.05;
    while (music.next < c.currentTime + 0.6) {
      var bar = Math.floor(music.step / 8) % CHORDS.length, i = music.step % 8, ch = CHORDS[bar];
      musicNote(ch[ARP[i]] * 2, music.next, 0.9, 'triangle', 0.05);
      if (i === 0) {
        musicNote(ch[0] / 2, music.next, 3.2, 'sine', 0.09);
        musicNote(ch[1], music.next, 3.2, 'sine', 0.03);

  function startAmbient() {

      o.connect(g); o.start();
    });
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);

  function initStars() {

  }

  function buildLives() {

  function reset() {

  function endGame() {

  function burst(x, y, color, n, speed) {

    }
  }

  var LEVELS = [
    { name: 'Lily Pond', col: '#FF9EC4' },
    { name: 'Old Lantern', col: '#FFC46B' },
    { name: 'Willow Hollow', col: '#9EE6A8' },
    { name: 'Mossy Bridge', col: '#8EC9FF' },
    { name: 'Cattail Grove', col: '#E8B07A' },
    { name: 'Moon Pool', col: '#C9B8FF' },
    { name: 'Reed Castle', col: '#7FE3D2' },
    { name: 'Fern Canyon', col: '#B6F07A' },
    { name: 'Starlit Meadow', col: '#FFE27A' },
    { name: 'Firefly Home', col: '#FFFFFF' }
  ];
  function levelInfo(L) {
    var b = LEVELS[(L - 1) % LEVELS.length], round = Math.floor((L - 1) / LEVELS.length);

  function lvlParams(L) {

      gap: Math.max(0.24, 0.95 - L * 0.05),
      orbP: Math.max(0.18, 0.32 - L * 0.01),
      dart: L >= 3 ? Math.min(0.35, 0.08 * (L - 2)) : 0,
      wobble: Math.min(80, 10 + L * 10),
      wind: L >= 5 ? Math.min(220, 40 * (L - 3)) : 0,

  var bannerTimer = null;

  function refreshLevelSel() {

    document.getElementById('lvlPrev').disabled = level <= 1;
    document.getElementById('lvlNext').disabled = level >= maxLevel;
  }

  function spawn() {
    var x = 24 * S + Math.random() * (W - 48 * S);
    if (Math.random() < P.orbP) {
      orbs.push({ x: x, y: -20, vy: (85 + level * 5) * S, r: 11 * S, ph: Math.random() * 6 });
    } else if (Math.random() < P.dart) {
      var dr = 9 * S;
      hazards.push({ kind: 'dart', x: x, y: -dr * 3, vy: P.speed * 1.8 * S * (0.9 + Math.random() * 0.3), r: dr, rot: 0, vr: 0, amp: 0, fr: 0, ph: 0, warn: 0.7 });
    } else {
      var r = (12 + Math.random() * 12) * S;
      hazards.push({ x: x, y: -r * 2, vy: P.speed * S * (0.85 + Math.random() * 0.4) * (1 + Math.min(1, t / P.dur) * 0.25), r: r, rot: 0, vr: (Math.random() - 0.5) * 3, amp: Math.random() * P.wobble * S, fr: 1 + Math.random() * 2, ph: Math.random() * 6 });
    }
  }

  function completeLevel() {
    state = 'complete';
    var done = level, info = levelInfo(done), bonusCoins = 3 + done;
    score += 50 * done;
    var s = Math.floor(score);
    if (s > best) { best = s; try { localStorage.setItem('glimmer-best', String(best)); } catch (e) {} }
    var gained = runCoins + bonusCoins;
    wallet.coins += gained; saveWallet(); refreshCoinTotals();
    if (done >= maxLevel) { maxLevel = done + 1; try { localStorage.setItem('glimmer-maxlevel', String(maxLevel)); } catch (e) {} }
    level = Math.min(done + 1, maxLevel);
    burst(goal.x, goal.y, info.col, 40, 260);
    burst(goal.x, goal.y, COLORS.glow, 24, 200);
    sfxWin();
    if (navigator.vibrate) { try { navigator.vibrate([40, 40, 80]); } catch (e) {} }
    document.getElementById('cTitle').textContent = 'Level ' + done + ' clear!';
    document.getElementById('cDest').textContent = 'You reached the ' + info.name;
    document.getElementById('cScore').textContent = s;

  function hit() {

    updateLives();
    comboEl.classList.remove('on');
    burst(player.x, player.y, COLORS.ember, 22, 220);
    sfxHit();
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    if (lives <= 0) { burst(player.x, player.y, COLORS.glow, 40, 280); endGame(); }
  }

  function update(dt) {
    t += dt;
    score += dt * 4;
    audio.chirpT -= dt;
    if (audio.chirpT <= 0) { chirp(); audio.chirpT = 1.5 + Math.random() * 3; }

    // keyboard
    var kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    var ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
    if (kx || ky) { player.tx += kx * 420 * S * dt; player.ty += ky * 420 * S * dt; }
    if (ctl.mode === 'joystick' && ctl.active) {
      var jx = (ctl.sx - ctl.bx) / (JOY_R * S), jy = (ctl.sy - ctl.by) / (JOY_R * S);
      if (Math.sqrt(jx * jx + jy * jy) > 0.12) { player.tx += jx * 560 * S * ctl.sens * dt; player.ty += jy * 560 * S * ctl.sens * dt; }
    }
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
    player.ty = Math.max(player.r + 60, Math.min(H - player.r - 10, player.ty));

    if (P.wind) {
      wind.next -= dt;
      if (wind.t <= 0 && wind.next <= 0) { wind.t = 1.6; wind.dir = Math.random() < 0.5 ? -1 : 1; wind.next = 5 + Math.random() * 4; }
      if (wind.t > 0) {
        wind.t -= dt;
        var push = wind.dir * P.wind * S * dt * Math.sin(Math.PI * Math.max(0, 1 - wind.t / 1.6));
        player.tx += push; player.x += push;
      }
    }
    var k = Math.min(1, dt * 13);
    player.x += (player.tx - player.x) * k;
    player.y += (player.ty - player.y) * k;

    trail.push({ x: player.x, y: player.y, a: 1 });
    for (var i = trail.length - 1; i >= 0; i--) { trail[i].a -= dt * 2.4; if (trail[i].a <= 0) trail.splice(i, 1); }

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = P.gap * (goal ? 1.3 : 1) * (0.7 + Math.random() * 0.6); }

    if (inv > 0) inv -= dt;
    if (shake > 0) shake -= dt;

    for (i = hazards.length - 1; i >= 0; i--) {
      var h = hazards[i];
      if (h.warn > 0) { h.warn -= dt; continue; }
      h.y += h.vy * dt;
      h.x += Math.sin(h.ph + t * h.fr) * h.amp * dt;
      h.rot += h.vr * dt;
      if (h.y > H + 40) { hazards.splice(i, 1); score += 1; continue; }
      if (inv <= 0 && state === 'play') {
        var dx = h.x - player.x, dy = h.y - player.y, rr = h.r * 0.8 + player.r * 0.7;
        if (dx * dx + dy * dy < rr * rr) { hazards.splice(i, 1); hit(); if (state !== 'play') return; }
      }
    }

    for (i = orbs.length - 1; i >= 0; i--) {
      var o = orbs[i];
      o.y += o.vy * dt;
      if (o.y > H + 30) { orbs.splice(i, 1); continue; }
      var ox = o.x - player.x, oy = o.y - player.y, orr = o.r + player.r + 6 * S;
      if (ox * ox + oy * oy < orr * orr) {
        orbs.splice(i, 1);
        streak++;
        var mult = Math.min(8, 1 + Math.floor(streak / 3));
        score += 10 * mult;
        burst(o.x, o.y, COLORS.glow, 14, 160);
        sfxCollect(streak);
        runCoins++; runCoinsEl.textContent = runCoins;
        if (mult > 1) { comboEl.textContent = 'x' + mult; comboEl.classList.add('on'); }
      }
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // level progress and goal
    if (!goal) {
      progressEl.style.width = Math.min(100, t / P.dur * 100) + '%';
      if (t >= P.dur) {
        goal = { bx: W * (0.3 + Math.random() * 0.4), x: 0, y: -60 * S, ty: Math.max(120 * S, H * 0.17), r: P.goalR * S };
        goal.x = goal.bx;
        progressEl.style.width = '100%';
        showBanner('Almost there!', 'Reach the glow at the top', 2600);
      }
    } else {
      goal.y = Math.min(goal.ty, goal.y + 70 * S * dt);
      goal.x = Math.max(W * 0.15, Math.min(W * 0.85, goal.bx + Math.sin(t * 0.9) * P.goalSway * S));
      var gx = goal.x - player.x, gy = goal.y - player.y, gr = goal.r + player.r * 0.5;
      if (gx * gx + gy * gy < gr * gr) { completeLevel(); return; }
    }
    showScore(false);
  }

  function drawBackground(dt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a0f33'); g.addColorStop(0.55, COLORS.dusk); g.addColorStop(1, '#3a2358');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var now = performance.now() / 1000;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.v * dt * (state === 'play' ? 1 + t * 0.03 : 1);
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now * 1.5 + s.tw);
      ctx.fillStyle = COLORS.mist;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // marsh hills
    var drift = now * 6;
    for (var layer = 0; layer < 2; layer++) {
      ctx.beginPath();
      ctx.moveTo(0, H);
      var base = H - (layer === 0 ? 70 : 38) * S;
      for (var x = 0; x <= W; x += 12) {
        var y = base + Math.sin((x + drift * (layer + 1)) / (70 + layer * 40)) * 14 * S + Math.sin((x - drift) / 31) * 4 * S;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = layer === 0 ? 'rgba(31,92,99,.45)' : 'rgba(31,92,99,.8)';
      ctx.fill();
    }
  }

  function glowCircle(x, y, r, color, alpha) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = alpha; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawStar(x, y, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 12; i++) {
      var rad = i % 2 === 0 ? r : r * 0.45, a = rot + i * Math.PI / 6;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function draw(dt) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake * 3, (Math.random() - 0.5) * 10 * shake * 3);
    drawBackground(dt);
    if (!player) { ctx.restore(); return; }
    var now = performance.now() / 1000;

    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < orbs.length; i++) {
      var o = orbs[i], pulse = 1 + Math.sin(now * 6 + o.ph) * 0.12;
      glowCircle(o.x, o.y, o.r * 3.2 * pulse, COLORS.glow, 0.55);
      ctx.fillStyle = COLORS.glow;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.7 * pulse, 0, Math.PI * 2); ctx.fill();
    }
    for (i = 0; i < trail.length; i++) {
      var tr = trail[i];
      ctx.globalAlpha = tr.a * 0.4; ctx.fillStyle = avatarById(wallet.sel).glow;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, player.r * 0.35 * tr.a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // destination glow on the horizon
    if (!goal && P) {
      var prg = Math.min(1, t / P.dur);
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(W * 0.5, -20, W * (0.25 + 0.6 * prg), levelInfo(level).col, 0.12 + 0.35 * prg);
      ctx.globalCompositeOperation = 'source-over';
    }

    // wind streaks
    if (wind.t > 0) {
      var env = Math.sin(Math.PI * Math.max(0, 1 - wind.t / 1.6));
      ctx.strokeStyle = 'rgba(237,230,255,' + (0.35 * env) + ')'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (var wi = 0; wi < 9; wi++) {
        var wy = (wi * 97 + now * 120) % H, wx = (now * 700 * wind.dir + wi * 173) % W;
        if (wx < 0) wx += W;
        ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + wind.dir * 46 * S, wy); ctx.stroke();
      }
    }

    for (i = 0; i < hazards.length; i++) {
      var h = hazards[i];
      if (h.kind === 'dart') {
        if (h.warn > 0) {
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(now * 20);
          ctx.fillStyle = COLORS.ember;
          ctx.beginPath(); ctx.moveTo(h.x, 140 * S); ctx.lineTo(h.x - 11 * S, 114 * S); ctx.lineTo(h.x + 11 * S, 114 * S); ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 1;
          continue;
        }
        ctx.fillStyle = COLORS.ember;
        ctx.beginPath(); ctx.moveTo(h.x, h.y + h.r * 2.6); ctx.lineTo(h.x + h.r, h.y - h.r * 1.2); ctx.lineTo(h.x, h.y - h.r * 0.6); ctx.lineTo(h.x - h.r, h.y - h.r * 1.2); ctx.closePath(); ctx.fill();
        continue;
      }
      ctx.fillStyle = COLORS.ember;
      drawStar(h.x, h.y, h.r, h.rot); ctx.fill();
      ctx.fillStyle = '#7a2a3a';
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 0.28, 0, Math.PI * 2); ctx.fill();
    }

    // destination
    if (goal) {
      var gcol = levelInfo(level).col, gp = 1 + Math.sin(now * 3) * 0.06;
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(goal.x, goal.y, goal.r * 3.6 * gp, gcol, 0.6);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#2A7F86';
      ctx.beginPath(); ctx.ellipse(goal.x, goal.y + goal.r * 0.45, goal.r * 1.15, goal.r * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = gcol;
      for (var pi2 = -2; pi2 <= 2; pi2++) {
        ctx.save(); ctx.translate(goal.x, goal.y + goal.r * 0.3); ctx.rotate(pi2 * 0.5);
        ctx.beginPath(); ctx.ellipse(0, -goal.r * 0.5, goal.r * 0.3, goal.r * 0.7, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle = '#FFF6C8';
      ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r * 0.22, 0, Math.PI * 2); ctx.fill();
    }

    // avatar
    if ((state === 'play' || state === 'complete') && !(inv > 0 && Math.floor(inv * 14) % 2 === 0)) {
      drawAvatar(ctx, wallet.sel, player.x, player.y, player.r, now, 5);
    }
    ctx.restore();
    drawJoystick();
  }

  function drawJoystick() {
    if (state !== 'play' || ctl.mode !== 'joystick') return;
    if (!ctl.active && t > 6) return;
    var R = JOY_R * S, bx, by, sx, sy, a;
    if (ctl.active) { bx = ctl.bx; by = ctl.by; sx = ctl.sx; sy = ctl.sy; a = 1; }
    else { bx = sx = W * 0.5; by = sy = H - 120 * S; a = 0.45; }
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(237,230,255,.12)';
    ctx.strokeStyle = 'rgba(237,230,255,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(217,242,107,.6)';
    ctx.strokeStyle = 'rgba(217,242,107,.9)';
    ctx.beginPath(); ctx.arc(sx, sy, R * 0.42, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function frame(now) {
    var dt = Math.min(0.033, (now - (last || now)) / 1000);
    last = now;
    if (state === 'play') update(dt);
    else if ((state === 'over' || state === 'complete') && particles) {
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    draw(dt);
    if (!shopEl.hidden) redrawPreviews(now / 1000);
    requestAnimationFrame(frame);
  }

  // Input
  function setTarget(e) {
    if (state !== 'play') return;
    var rect = canvas.getBoundingClientRect();
    player.tx = e.clientX - rect.left;
    player.ty = e.clientY - rect.top - (e.pointerType === 'touch' ? 70 * S : 0);
  }
  function ctlPoint(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'play') return;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
    if (ctl.mode === 'drag') { setTarget(e); return; }
    if (ctl.active) return;
    var p = ctlPoint(e);
    ctl.active = true; ctl.id = e.pointerId; ctl.bx = ctl.sx = p.x; ctl.by = ctl.sy = p.y;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (state !== 'play') return;
    if (ctl.mode === 'drag') { setTarget(e); return; }
    if (!ctl.active || e.pointerId !== ctl.id) return;
    var p = ctlPoint(e), dx = p.x - ctl.bx, dy = p.y - ctl.by, R = JOY_R * S, d = Math.sqrt(dx * dx + dy * dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    ctl.sx = ctl.bx + dx; ctl.sy = ctl.by + dy;
  });
  function endJoy(e) { if (ctl.active && e.pointerId === ctl.id) ctl.active = false; }
  canvas.addEventListener('pointerup', endJoy);
  canvas.addEventListener('pointercancel', endJoy);
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if ((e.key === 'Enter' || e.key === ' ') && (state === 'menu' || state === 'over') && document.activeElement === document.body && shopEl.hidden && settingsEl.hidden) { e.preventDefault(); startGame(); }
    if (e.key === 'Escape' || e.key === 'p') { if (state === 'play') pauseGame(); else if (state === 'paused' && settingsEl.hidden) resumeGame(); }
    if (e.key.indexOf('Arrow') === 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('visibilitychange', function () {
    last = performance.now();
    if (document.hidden) pauseGame();
    if (audio.ctx) { if (document.hidden) audio.ctx.suspend(); else audio.ctx.resume(); }
  });

  document.getElementById('start').addEventListener('click', startGame);
  document.getElementById('again').addEventListener('click', startGame);
  muteBtn.addEventListener('click', function (e) { e.stopPropagation(); initAudio(); setMuted(!audio.muted); if (!audio.muted) sfxCollect(1); });
  window.addEventListener('pointerdown', initAudio);
  document.getElementById('openShop').addEventListener('click', function () { openShop('menu'); });
  document.getElementById('openShop2').addEventListener('click', function () { openShop('over'); });
  document.getElementById('shopBack').addEventListener('click', closeShop);

  // ---- Settings, pause and menu ----
  ctl.sens = 1;
  try { var sv = parseFloat(localStorage.getItem('glimmer-sens')); if (sv >= 0.5 && sv <= 2) ctl.sens = sv; } catch (e) {}
  var settingsFrom = 'menu';
  function syncSettings() {
    var b, i, list = document.querySelectorAll('#ctlSeg button');
    for (i = 0; i < list.length; i++) list[i].classList.toggle('on', list[i].getAttribute('data-mode') === ctl.mode);
    list = document.querySelectorAll('#sndSeg button');
    for (i = 0; i < list.length; i++) list[i].classList.toggle('on', (list[i].getAttribute('data-snd') === 'off') === audio.muted);
    var sl = document.getElementById('sens');
    if (parseFloat(sl.value) !== ctl.sens) sl.value = ctl.sens;
    sl.disabled = ctl.mode !== 'joystick';
    document.getElementById('sensVal').textContent = ctl.sens.toFixed(1) + 'x';
    document.getElementById('sensRow').classList.toggle('off', ctl.mode !== 'joystick');
  }
  function openSettings(from) {
    settingsFrom = from; menu.hidden = true; pauseEl.hidden = true; settingsEl.hidden = false; syncSettings();
  }
  function closeSettings() {
    settingsEl.hidden = true;
    if (settingsFrom === 'pause') pauseEl.hidden = false; else menu.hidden = false;
  }
  function refreshMenuBest() { menuBestEl.textContent = best ? 'Best score ' + best : ''; refreshLevelSel(); }
  function pauseGame() {
    if (state !== 'play') return;
    state = 'paused'; ctl.active = false; pauseEl.hidden = false;
  }
  function resumeGame() {
    pauseEl.hidden = true; state = 'play'; last = performance.now();
  }
  function quitToMenu() {
    var s = Math.floor(score);
    if (s > best) { best = s; try { localStorage.setItem('glimmer-best', String(best)); } catch (e) {} }
    wallet.coins += runCoins; saveWallet(); refreshCoinTotals();
    pauseEl.hidden = true; hud.hidden = true; pauseBtn.hidden = true;
    reset(); state = 'menu'; menu.hidden = false; refreshMenuBest();
  }
  document.getElementById('openSettings').addEventListener('click', function () { openSettings('menu'); });
  document.getElementById('pauseSettings').addEventListener('click', function () { openSettings('pause'); });
  document.getElementById('settingsBack').addEventListener('click', closeSettings);
  document.getElementById('pauseBtn').addEventListener('click', pauseGame);
  document.getElementById('resume').addEventListener('click', resumeGame);
  document.getElementById('quit').addEventListener('click', quitToMenu);
  document.getElementById('lvlPrev').addEventListener('click', function () { if (level > 1) { level--; refreshLevelSel(); } });
  document.getElementById('lvlNext').addEventListener('click', function () { if (level < maxLevel) { level++; refreshLevelSel(); } });
  document.getElementById('nextLevel').addEventListener('click', startGame);
  document.getElementById('cMenu').addEventListener('click', function () { completeEl.hidden = true; menu.hidden = false; refreshMenuBest(); });
  document.getElementById('toMenu').addEventListener('click', function () { over.hidden = true; menu.hidden = false; refreshMenuBest(); });
  document.getElementById('ctlSeg').addEventListener('click', function (e) {
    var m = e.target.getAttribute && e.target.getAttribute('data-mode');
    if (!m) return;
    ctl.mode = m; ctl.active = false;
    try { localStorage.setItem('glimmer-controls', m); } catch (err) {}
    syncSettings();
  });
  document.getElementById('sndSeg').addEventListener('click', function (e) {
    var v = e.target.getAttribute && e.target.getAttribute('data-snd');
    if (!v) return;
    initAudio(); setMuted(v === 'off');
  });
  document.getElementById('sens').addEventListener('input', function () {
    ctl.sens = parseFloat(this.value);
    try { localStorage.setItem('glimmer-sens', String(ctl.sens)); } catch (err) {}
    syncSettings();
  });
  window.addEventListener('resize', function () { resize(); initStars(); });

  resize();
  buildLives();
  reset();
  state = 'menu';
  bestEl.textContent = best ? 'Best ' + best : '';
  refreshCoinTotals();
  refreshMenuBest();
  syncSettings();
  requestAnimationFrame(frame);
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
