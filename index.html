<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241640">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Glimmer – a firefly dodge game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --dusk: #241640;
    --marsh: #1F5C63;
    --glow: #D9F26B;
    --ember: #FF7A6B;
    --mist: #EDE6FF;
    --font: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0;
    background: var(--dusk);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { height: 100%; position: relative; font-family: var(--font); color: var(--mist); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px; pointer-events: none;
  }
  .score { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .combo {
    display: inline-block; margin-left: 8px; font-size: 20px; font-weight: 700;
    color: var(--glow); opacity: 0; transition: opacity .2s;
  }
  .combo.on { opacity: 1; }
  .best { font-size: 14px; opacity: .65; margin-top: 4px; }
  .lives { display: flex; gap: 8px; padding-top: 6px; }
  .life {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 12px 2px rgba(217,242,107,.7);
    transition: transform .25s, opacity .25s, background .25s, box-shadow .25s;
  }
  .life.lost { background: transparent; box-shadow: none; opacity: .35; border: 2px solid var(--mist); transform: scale(.8); }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(36,22,64,.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .panel { max-width: 340px; text-align: center; }
  h1 { margin: 0 0 10px; font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: .95; color: var(--glow); text-shadow: 0 0 28px rgba(217,242,107,.45); }
  p { margin: 0 0 22px; font-size: 18px; line-height: 1.4; opacity: .9; }
  .big { font-size: 56px; font-weight: 800; line-height: 1; margin: 0 0 4px; font-variant-numeric: tabular-nums; }
  .note { font-size: 16px; margin-bottom: 22px; opacity: .8; }
  button {
    font: 700 20px var(--font); color: var(--dusk); background: var(--glow);
    border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer;
    box-shadow: 0 0 24px rgba(217,242,107,.45);
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--mist); outline-offset: 3px; }
  .legend { display: flex; justify-content: center; gap: 22px; margin: 0 0 24px; font-size: 15px; opacity: .85; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
  .thorn { width: 14px; height: 14px; background: var(--ember); clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); }
</style>
</head>
<body>
<canvas id="c" aria-label="Glimmer game"></canvas>

<div class="hud" id="hud" hidden>
  <div>
    <div><span class="score" id="score">0</span><span class="combo" id="combo">x2</span></div>
    <div class="best" id="best"></div>
  </div>
  <div class="lives" id="lives" aria-label="Lives"></div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Glimmer</h1>
    <p>Drag your finger to guide the firefly through the marsh at dusk.</p>
    <div class="legend"><span><i class="dot"></i>Catch</span><span><i class="thorn"></i>Dodge</span></div>
    <button id="start">Start flying</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <h1 style="font-size:44px">Lights out</h1>
    <div class="big" id="final">0</div>
    <div class="note" id="finalNote"></div>
    <button id="again">Fly again</button>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');
  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var bestEl = document.getElementById('best');
  var livesEl = document.getElementById('lives');
  var menu = document.getElementById('menu');
  var over = document.getElementById('over');
  var finalEl = document.getElementById('final');
  var finalNote = document.getElementById('finalNote');

  var COLORS = { dusk: '#241640', marsh: '#1F5C63', glow: '#D9F26B', ember: '#FF7A6B', mist: '#EDE6FF' };

  var W = 0, H = 0, S = 1, dpr = 1;
  var state = 'menu';
  var best = 0;
  try { best = parseInt(localStorage.getItem('glimmer-best') || '0', 10) || 0; } catch (e) {}

  var player, hazards, orbs, particles, trail, stars;
  var score, lives, t, streak, spawnT, inv, shake, lastShownScore, last;
  var keys = {};

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.6, Math.min(1.3, H / 700));
    if (!stars) initStars();
  }

  function initStars() {
    stars = [];
    for (var i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.4, v: Math.random() * 10 + 4, tw: Math.random() * 6 });
  }

  function buildLives() {
    livesEl.innerHTML = '';
    for (var i = 0; i < 3; i++) { var d = document.createElement('div'); d.className = 'life'; livesEl.appendChild(d); }
  }
  function updateLives() {
    var els = livesEl.children;
    for (var i = 0; i < els.length; i++) els[i].classList.toggle('lost', i >= lives);
  }

  function reset() {
    player = { x: W / 2, y: H * 0.72, tx: W / 2, ty: H * 0.72, r: 13 * S };
    hazards = []; orbs = []; particles = []; trail = [];
    score = 0; lives = 3; t = 0; streak = 0; spawnT = 0.4; inv = 0; shake = 0; lastShownScore = -1;
    buildLives(); updateLives();
    showScore(true);
    bestEl.textContent = best ? 'Best ' + best : '';
    comboEl.classList.remove('on');
  }

  function startGame() {
    reset();
    menu.hidden = true; over.hidden = true; hud.hidden = false;
    state = 'play';
    last = performance.now();
  }

  function endGame() {
    state = 'over';
    var s = Math.floor(score);
    var isBest = s > best;
    if (isBest) { best = s; try { localStorage.setItem('glimmer-best', String(best)); } catch (e) {} }
    finalEl.textContent = s;
    finalNote.textContent = isBest ? 'New best! Beat it next time.' : 'Best: ' + best;
    hud.hidden = true;
    over.hidden = false;
  }

  function showScore(force) {
    var s = Math.floor(score);
    if (force || s !== lastShownScore) { scoreEl.textContent = s; lastShownScore = s; }
  }

  function burst(x, y, color, n, speed) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * speed * S;
      particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.4, max: 1, color: color, size: (1.5 + Math.random() * 2.5) * S });
    }
  }

  function spawn() {
    var x = 24 * S + Math.random() * (W - 48 * S);
    if (Math.random() < 0.3) {
      orbs.push({ x: x, y: -20, vy: (90 + t * 2) * S, r: 11 * S, ph: Math.random() * 6 });
    } else {
      var r = (12 + Math.random() * 12) * S;
      hazards.push({ x: x, y: -r * 2, vy: Math.min(110 + t * 4.5, 380) * S * (0.85 + Math.random() * 0.4), r: r, rot: 0, vr: (Math.random() - 0.5) * 3, amp: Math.random() * 40 * S, fr: 1 + Math.random() * 2, ph: Math.random() * 6 });
    }
  }

  function hit() {
    lives--; streak = 0; inv = 1.4; shake = 0.35;
    updateLives();
    comboEl.classList.remove('on');
    burst(player.x, player.y, COLORS.ember, 22, 220);
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    if (lives <= 0) { burst(player.x, player.y, COLORS.glow, 40, 280); endGame(); }
  }

  function update(dt) {
    t += dt;
    score += dt * 4;

    // keyboard
    var kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    var ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
    if (kx || ky) { player.tx += kx * 420 * S * dt; player.ty += ky * 420 * S * dt; }
    player.tx = Math.max(player.r, Math.min(W - player.r, player.tx));
    player.ty = Math.max(player.r + 60, Math.min(H - player.r - 10, player.ty));

    var k = Math.min(1, dt * 13);
    player.x += (player.tx - player.x) * k;
    player.y += (player.ty - player.y) * k;

    trail.push({ x: player.x, y: player.y, a: 1 });
    for (var i = trail.length - 1; i >= 0; i--) { trail[i].a -= dt * 2.4; if (trail[i].a <= 0) trail.splice(i, 1); }

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.26, 0.85 - t * 0.011) * (0.7 + Math.random() * 0.6); }

    if (inv > 0) inv -= dt;
    if (shake > 0) shake -= dt;

    for (i = hazards.length - 1; i >= 0; i--) {
      var h = hazards[i];
      h.y += h.vy * dt;
      h.x += Math.sin(h.ph + t * h.fr) * h.amp * dt;
      h.rot += h.vr * dt;
      if (h.y > H + 40) { hazards.splice(i, 1); score += 1; continue; }
      if (inv <= 0 && state === 'play') {
        var dx = h.x - player.x, dy = h.y - player.y, rr = h.r * 0.8 + player.r * 0.7;
        if (dx * dx + dy * dy < rr * rr) { hazards.splice(i, 1); hit(); if (state !== 'play') return; }
      }
    }

    for (i = orbs.length - 1; i >= 0; i--) {
      var o = orbs[i];
      o.y += o.vy * dt;
      if (o.y > H + 30) { orbs.splice(i, 1); continue; }
      var ox = o.x - player.x, oy = o.y - player.y, orr = o.r + player.r + 6 * S;
      if (ox * ox + oy * oy < orr * orr) {
        orbs.splice(i, 1);
        streak++;
        var mult = Math.min(8, 1 + Math.floor(streak / 3));
        score += 10 * mult;
        burst(o.x, o.y, COLORS.glow, 14, 160);
        if (mult > 1) { comboEl.textContent = 'x' + mult; comboEl.classList.add('on'); }
      }
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    showScore(false);
  }

  function drawBackground(dt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a0f33'); g.addColorStop(0.55, COLORS.dusk); g.addColorStop(1, '#3a2358');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var now = performance.now() / 1000;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.v * dt * (state === 'play' ? 1 + t * 0.03 : 1);
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now * 1.5 + s.tw);
      ctx.fillStyle = COLORS.mist;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // marsh hills
    var drift = now * 6;
    for (var layer = 0; layer < 2; layer++) {
      ctx.beginPath();
      ctx.moveTo(0, H);
      var base = H - (layer === 0 ? 70 : 38) * S;
      for (var x = 0; x <= W; x += 12) {
        var y = base + Math.sin((x + drift * (layer + 1)) / (70 + layer * 40)) * 14 * S + Math.sin((x - drift) / 31) * 4 * S;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = layer === 0 ? 'rgba(31,92,99,.45)' : 'rgba(31,92,99,.8)';
      ctx.fill();
    }
  }

  function glowCircle(x, y, r, color, alpha) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = alpha; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawStar(x, y, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 12; i++) {
      var rad = i % 2 === 0 ? r : r * 0.45, a = rot + i * Math.PI / 6;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function draw(dt) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake * 3, (Math.random() - 0.5) * 10 * shake * 3);
    drawBackground(dt);
    if (!player) { ctx.restore(); return; }
    var now = performance.now() / 1000;

    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < orbs.length; i++) {
      var o = orbs[i], pulse = 1 + Math.sin(now * 6 + o.ph) * 0.12;
      glowCircle(o.x, o.y, o.r * 3.2 * pulse, COLORS.glow, 0.55);
      ctx.fillStyle = COLORS.glow;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.7 * pulse, 0, Math.PI * 2); ctx.fill();
    }
    for (i = 0; i < trail.length; i++) {
      var tr = trail[i];
      ctx.globalAlpha = tr.a * 0.4; ctx.fillStyle = COLORS.glow;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, player.r * 0.35 * tr.a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    for (i = 0; i < hazards.length; i++) {
      var h = hazards[i];
      ctx.fillStyle = COLORS.ember;
      drawStar(h.x, h.y, h.r, h.rot); ctx.fill();
      ctx.fillStyle = '#7a2a3a';
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 0.28, 0, Math.PI * 2); ctx.fill();
    }

    // firefly
    if (state === 'play' && !(inv > 0 && Math.floor(inv * 14) % 2 === 0)) {
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(player.x, player.y, player.r * 5, COLORS.glow, 0.5);
      ctx.globalCompositeOperation = 'source-over';
      var flap = Math.sin(now * 40) * 0.5;
      ctx.fillStyle = 'rgba(237,230,255,.75)';
      ctx.save(); ctx.translate(player.x, player.y - player.r * 0.3);
      ctx.rotate(-0.6 + flap * 0.5); ctx.beginPath(); ctx.ellipse(-player.r * 0.9, 0, player.r * 0.9, player.r * 0.38, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(player.x, player.y - player.r * 0.3);
      ctx.rotate(0.6 - flap * 0.5); ctx.beginPath(); ctx.ellipse(player.r * 0.9, 0, player.r * 0.9, player.r * 0.38, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = COLORS.glow;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COLORS.dusk;
      ctx.beginPath(); ctx.arc(player.x, player.y - player.r * 0.55, player.r * 0.32, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function frame(now) {
    var dt = Math.min(0.033, (now - (last || now)) / 1000);
    last = now;
    if (state === 'play') update(dt);
    else if (state === 'over' && particles) {
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    draw(dt);
    requestAnimationFrame(frame);
  }

  // Input
  function setTarget(e) {
    if (state !== 'play') return;
    var rect = canvas.getBoundingClientRect();
    player.tx = e.clientX - rect.left;
    player.ty = e.clientY - rect.top - (e.pointerType === 'touch' ? 70 * S : 0);
  }
  canvas.addEventListener('pointerdown', function (e) { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); setTarget(e); });
  canvas.addEventListener('pointermove', setTarget);
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') { e.preventDefault(); startGame(); }
    if (e.key.indexOf('Arrow') === 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('visibilitychange', function () { last = performance.now(); });

  document.getElementById('start').addEventListener('click', startGame);
  document.getElementById('again').addEventListener('click', startGame);
  window.addEventListener('resize', function () { resize(); initStars(); });

  resize();
  buildLives();
  reset();
  state = 'menu';
  bestEl.textContent = best ? 'Best ' + best : '';
  requestAnimationFrame(frame);
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
