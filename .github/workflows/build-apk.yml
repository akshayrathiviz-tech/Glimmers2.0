name: Build APK

on:
  workflow_dispatch:

env:
  APP_ID: com.example.glimmer
  APP_NAME: Glimmer

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/icons

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<JSON
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "backgroundColor": "#241640"
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Set app icon, splash color and portrait mode
        run: |
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; sz=${d##*:}
            for f in ic_launcher ic_launcher_round; do
              convert icons/icon-512.png -resize ${sz}x${sz} $RES/mipmap-$n/$f.png
            done
          done
          rm -rf $RES/mipmap-anydpi-v26
          find $RES -name 'splash.png' -exec convert -size 480x480 xc:'#241640' {} \;
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: glimmer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
